services:
  # ----------------------------------------------------------------------------
  # Option 1: Node.js PMU Server (InfluxDB + Socket.IO) [Default]
  # ----------------------------------------------------------------------------
  - type: web
    name: pmu-backend
    runtime: node
    plan: free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DEVICE_API_KEY
        sync: false
      - key: INFLUX_URL
        sync: false
      - key: INFLUX_TOKEN
        sync: false
      - key: INFLUX_ORG
        sync: false
      - key: INFLUX_BUCKET
        value: pmu_data

  # ----------------------------------------------------------------------------
  # Option 2: Python FastAPI PMU Server (Uncomment if deploying Python instead)
